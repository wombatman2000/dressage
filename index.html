<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dressage</title>
<meta name="description" content="Exercices de dressage du chien, à la maison et en balade, avec progression partagée.">
<meta name="theme-color" content="#2F5D3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dressage">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#F5F0E6; --surface:#FFFDF8; --surface-2:#EDE6D6; --ink:#1E2820; --ink-2:#5C6359;
  --line:#DDD4C2; --vert:#2F5D3A; --vert-2:#E1EBDD; --ocre:#B97A22; --ocre-2:#F6E7CC;
  --rouille:#A8432E; --rouille-2:#F5DDD5; --on-vert:#FFFDF8;
  --radius:18px; --shadow:0 1px 2px rgba(30,40,32,.06),0 4px 14px rgba(30,40,32,.06);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-titre:ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121813; --surface:#1B231D; --surface-2:#253027; --ink:#ECE6D8; --ink-2:#A3AA9C;
    --line:#303B32; --vert:#7DB487; --vert-2:#22362A; --ocre:#E2A64E; --ocre-2:#3A2E1A;
    --rouille:#E07D66; --rouille-2:#3B231D; --on-vert:#10170F;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121813; --surface:#1B231D; --surface-2:#253027; --ink:#ECE6D8; --ink-2:#A3AA9C;
  --line:#303B32; --vert:#7DB487; --vert-2:#22362A; --ocre:#E2A64E; --ocre-2:#3A2E1A;
  --rouille:#E07D66; --rouille-2:#3B231D; --on-vert:#10170F; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--font-titre);margin:0;letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* En-tête */
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:10px;padding:12px 0 10px}
.top h1{font-size:24px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-2);flex:none}
.dot.ok{background:#3E9B55}.dot.attente{background:var(--ocre)}.dot.erreur{background:var(--rouille)}

/* Navigation */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
nav button{background:none;border:0;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--ink-2)}
nav button svg{width:24px;height:24px}
nav button[aria-current="page"]{color:var(--vert)}

/* Cartes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.section-t{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:22px 4px 8px}
.muted{color:var(--ink-2)}
.small{font-size:14px}

/* Segmenté */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px;margin:4px 0 14px}
.seg button{border:0;background:none;padding:10px 6px;border-radius:11px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* Boutons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px 16px;font-weight:700;font-size:17px;background:var(--vert);color:var(--on-vert)}
.btn.sec{background:var(--surface-2);color:var(--ink)}
.btn.ocre{background:var(--ocre);color:#fff}
.btn.danger{background:var(--rouille-2);color:var(--rouille)}
.btn.petit{padding:10px 14px;font-size:15px;width:auto}
.btn:disabled{opacity:.45}
.lien{background:none;border:0;color:var(--vert);font-weight:600;padding:8px 4px}
.row{display:flex;gap:10px;align-items:center}
.row > *{flex:1}

/* Héros séance */
.hero{background:var(--vert);color:var(--on-vert);border:0}
.hero h2{font-size:22px;margin-bottom:4px}
.hero p{margin:0 0 14px;opacity:.88}
.hero .btn{background:var(--on-vert);color:var(--vert)}

/* Exercice */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--vert-2);color:var(--vert)}
.chip.ocre{background:var(--ocre-2);color:var(--ocre)}
.chip.rouille{background:var(--rouille-2);color:var(--rouille)}
.chip.gris{background:var(--surface-2);color:var(--ink-2)}
.ex h2{font-size:23px;margin:10px 0 6px}
.cue{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14.5px;background:var(--surface-2);border-radius:12px;padding:10px 12px;margin:10px 0}
.cue b{color:var(--ink-2);font-weight:600}
ol.etapes{margin:12px 0;padding-left:22px}
ol.etapes li{margin-bottom:7px}
.objectif{display:flex;gap:8px;align-items:flex-start;font-weight:600;padding:10px 12px;border-radius:12px;background:var(--ocre-2);color:var(--ink);font-size:15px}
.choix{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.choix .ok{background:var(--vert)}
.choix .ko{background:var(--rouille);color:#fff}
.progress{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--vert);border-radius:99px;transition:width .3s}
.etape-n{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 10px;font-size:14px;color:var(--ink-2);font-weight:600}

/* Missions de balade */
.mission{padding:14px}
.mission summary{list-style:none;display:flex;gap:10px;align-items:center;cursor:pointer}
.mission summary::-webkit-details-marker{display:none}
.mission .emo{font-size:24px;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--surface-2);flex:none}
.mission h3{font-size:17px}
.mission .chev{margin-left:auto;color:var(--ink-2);transition:transform .2s;flex:none}
.mission[open] .chev{transform:rotate(90deg)}
.fait{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:10px 12px;border-radius:12px;font-weight:700}
.fait.ok{background:var(--vert-2);color:var(--vert)}
.fait.ko{background:var(--rouille-2);color:var(--rouille)}

/* Listes */
.liste{list-style:none;margin:0;padding:0}
.liste li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.liste li:last-child{border-bottom:0}
.liste .grow{flex:1;min-width:0}
.liste .t{font-weight:600}
.niv{display:inline-flex;gap:3px;vertical-align:middle}
.niv i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.niv i.on{background:var(--ocre)}
.maitrise{display:inline-flex;gap:3px}
.maitrise i{width:14px;height:6px;border-radius:3px;background:var(--surface-2)}
.maitrise i.on{background:var(--vert)}
.ex-row{width:100%;text-align:left;background:none;border:0;padding:0;display:flex;align-items:center;gap:12px}
.lock{opacity:.5}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--font-titre);font-size:26px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--ink-2)}
.ordre-p{display:grid;grid-template-columns:34px 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ordre-p:last-child{border-bottom:0}
.ordre-p .e{grid-row:span 2;font-size:22px;text-align:center}
.ordre-p .progress{grid-column:2 / span 2}

/* Formulaires */
label.f{display:block;font-size:14px;font-weight:600;color:var(--ink-2);margin:12px 0 6px}
input[type=text],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px}
textarea{min-height:90px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:13.5px}
textarea.prose{font-family:var(--font);font-size:16px}
.switch{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch input{appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:none;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked{background:var(--vert)}
.switch input:checked::after{left:21px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;word-break:break-all;background:var(--surface-2);padding:10px 12px;border-radius:12px;user-select:all}
.steps-guide{margin:8px 0;padding-left:20px}
.steps-guide li{margin-bottom:6px}

/* Feuille modale */
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,11,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet .poignee{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@keyframes fade{from{opacity:0}}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));z-index:30;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:14px;display:flex;gap:14px;align-items:center;font-weight:600;font-size:15px;max-width:calc(100% - 32px);animation:fade .15s}
.toast button{background:none;border:0;color:var(--ocre);font-weight:800;padding:0}

.vide{text-align:center;padding:28px 12px;color:var(--ink-2)}
.fin{text-align:center;padding:26px 16px}
.fin .big{font-size:54px;line-height:1}
.fin h2{font-size:26px;margin:10px 0 4px}
details.regles summary{font-weight:700;cursor:pointer}
details.regles ul{margin:10px 0 0;padding-left:20px}
details.regles li{margin-bottom:6px}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <h1 id="titre">Dressage</h1>
    <span class="pill" id="serie" hidden></span>
    <span class="pill" id="sync" hidden><span class="dot"></span><span></span></span>
  </div>
</header>

<main class="wrap" id="vue"></main>

<nav>
  <div class="wrap">
    <button data-tab="seance" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l5.5-3.5z" fill="currentColor"/></svg>
      Séance</button>
    <button data-tab="progres">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      Progrès</button>
    <button data-tab="exercices">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
      Exercices</button>
    <button data-tab="reglages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      Réglages</button>
  </div>
</nav>

<script src="exercices.js"></script>
<script src="app.js"></script>
</body>
</html>
